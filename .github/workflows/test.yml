name: test

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml gate on this exact workflow.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      # Installs Go and golangci-lint at the versions pinned in mise.toml.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: mise run lint
      - run: mise run test
