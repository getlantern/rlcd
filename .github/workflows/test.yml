name: test

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml gate on this exact workflow.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@v5
      - run: mise run test
